<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- SEO Meta Tags -->
    <title>NovaVolt | Claim Your £7,000 Heat Pump Grant</title>
    <meta name="description" content="Upgrade to a modern, energy-efficient heat pump with NovaVolt. Claim your £7,000 UK government grant today and lower your heating bills." />
    <meta name="keywords" content="heat pump, UK government grant, boiler upgrade scheme, NovaVolt, eco-friendly heating, energy bills, sleek heat pump" />
    <meta name="author" content="NovaVolt" />
    <link rel="canonical" href="https://novavolt.co.uk/" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NovaVolt | £7,000 Government Grant for Heat Pumps" />
    <meta property="og:description" content="Upgrade to a modern, energy-efficient heat pump with NovaVolt. Save money and the planet." />
    <meta property="og:image" content="https://coresg-normal.trae.ai/api/ide/v1/text_to_image?prompt=sleek%20modern%20black%20heat%20pump%20unit%20exterior%20home&image_size=landscape_16_9" />

    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
